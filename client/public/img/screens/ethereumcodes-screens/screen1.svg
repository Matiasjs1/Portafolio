<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10182b"/>
      <stop offset="1" stop-color="#1a1f2e"/>
    </linearGradient>
    <linearGradient id="eth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#627eea"/>
      <stop offset="1" stop-color="#3a4db5"/>
    </linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff20"/>
      <stop offset="1" stop-color="#ffffff08"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="800" fill="url(#bg)"/>
  <!-- grid dots -->
  <g fill="#ffffff10">
    <circle cx="60" cy="60" r="3"/><circle cx="180" cy="60" r="3"/><circle cx="300" cy="60" r="3"/><circle cx="420" cy="60" r="3"/>
    <circle cx="60" cy="180" r="3"/><circle cx="180" cy="180" r="3"/><circle cx="300" cy="180" r="3"/><circle cx="420" cy="180" r="3"/>
  </g>
  <!-- eth logo -->
  <g transform="translate(100,120) scale(0.55)">
    <polygon fill="url(#eth)" points="256,0 256,470 0,256" opacity="0.9"/>
    <polygon fill="url(#eth)" points="256,0 512,256 256,470" opacity="0.75"/>
    <polygon fill="#93a7f5" points="256,536 0,320 256,470" opacity="0.95"/>
    <polygon fill="#93a7f5" points="256,536 512,320 256,470" opacity="0.8"/>
  </g>
  <text x="380" y="200" fill="#ffffff" font-family="Arial, sans-serif" font-size="52" font-weight="bold">EthereumCodes</text>
  <text x="384" y="248" fill="#8b93a8" font-family="Arial, sans-serif" font-size="24">Smart Contracts · Solidity · ERC20 · NFTs</text>
  <!-- contract cards -->
  <g transform="translate(120,420)">
    <rect width="320" height="180" rx="18" fill="url(#box)" stroke="#ffffff22" stroke-width="1.5"/>
    <rect x="24" y="24" width="46" height="46" rx="10" fill="#627eea40" stroke="#627eea" stroke-width="1.5"/>
    <text x="34" y="56" fill="#9fb3ff" font-family="Arial" font-size="28" font-weight="bold">V</text>
    <text x="88" y="48" fill="#ffffff" font-family="Arial" font-size="26" font-weight="bold">VotingSystem</text>
    <text x="88" y="78" fill="#8b93a8" font-family="Arial" font-size="17">IVotingSystem</text>
    <text x="26" y="130" fill="#8b93a8" font-family="Arial" font-size="17">On-chain proposal voting</text>
    <text x="26" y="156" fill="#8b93a8" font-family="Arial" font-size="17">Access control + counts</text>
  </g>
  <g transform="translate(480,420)">
    <rect width="320" height="180" rx="18" fill="url(#box)" stroke="#ffffff22" stroke-width="1.5"/>
    <rect x="24" y="24" width="46" height="46" rx="10" fill="#ffffff18" stroke="#ffffff40" stroke-width="1.5"/>
    <text x="34" y="56" fill="#ffffff" font-family="Arial" font-size="28" font-weight="bold">20</text>
    <text x="88" y="48" fill="#ffffff" font-family="Arial" font-size="26" font-weight="bold">ERC20 Token</text>
    <text x="88" y="78" fill="#8b93a8" font-family="Arial" font-size="17">OpenZeppelin</text>
    <text x="26" y="130" fill="#8b93a8" font-family="Arial" font-size="17">Standard fungible token</text>
    <text x="26" y="156" fill="#8b93a8" font-family="Arial" font-size="17">Transfer / allowance</text>
  </g>
  <g transform="translate(840,420)">
    <rect width="320" height="180" rx="18" fill="url(#box)" stroke="#ffffff22" stroke-width="1.5"/>
    <rect x="24" y="24" width="46" height="46" rx="10" fill="#ffffff18" stroke="#ffffff40" stroke-width="1.5"/>
    <text x="34" y="56" fill="#ffffff" font-family="Arial" font-size="28" font-weight="bold">#</text>
    <text x="88" y="48" fill="#ffffff" font-family="Arial" font-size="26" font-weight="bold">NFT</text>
    <text x="88" y="78" fill="#8b93a8" font-family="Arial" font-size="17">ERC-721</text>
    <text x="26" y="130" fill="#8b93a8" font-family="Arial" font-size="17">Unique tokens / minting</text>
    <text x="26" y="156" fill="#8b93a8" font-family="Arial" font-size="17">Metadata + ownership</text>
  </g>
  <!-- footer badge -->
  <g transform="translate(120,640)">
    <rect x="0" y="0" width="1040" height="60" rx="30" fill="#627eea1f" stroke="#627eea55" stroke-width="1.5"/>
    <text x="520" y="39" fill="#93a7f5" font-family="Arial" font-size="22" text-anchor="middle">Certified professional practicum · ETH KIPU · 50 hours</text>
  </g>
</svg>
