    <script>
      // Evita flash de tema incorrecto: aplica el tema guardado antes de que React cargue
      (function () {
        var t = localStorage.getItem('theme')
        if (t === 'light' || (!t && window.matchMedia('(prefers-color-scheme: light)').matches)) {
          document.documentElement.setAttribute('data-theme', 'light')
        }
      })()
      // Evita flash de idioma incorrecto: aplica el idioma guardado o el de la región
      (function () {
        var lang = localStorage.getItem('lang')
        if (!lang) {
          lang = (navigator.language || 'en').toLowerCase().startsWith('es') ? 'es' : 'en'
        }
        document.documentElement.lang = lang
      })()
    </script>
  </head>

  </body>
